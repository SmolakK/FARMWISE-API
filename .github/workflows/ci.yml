name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip ".[server,dev]"
      - name: Run tests
        run: python -m pytest -q

  locked:
    name: Pinned environment (requirements-lock.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check the lock file still matches pyproject.toml
        run: |
          python -m pip install --upgrade pip
          python tools/make_lock.py --check
      - name: Install the locked environment
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Run tests against the pinned versions
        run: python -m pytest -q

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tools
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Upload distributions for inspection
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
