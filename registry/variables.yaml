# This file holds only what cannot be derived from the code: native
# units, spatial/temporal support, and literature references. Everything
# else (variable names, output units, aggregation and harmonisation
# rules, coverage) is read live from the adapters by
# tools/build_registry.py and must not be duplicated here.
#
# `null` means NOT YET SUPPLIED. It is reported as missing, never
# guessed. Fill these in from provider documentation and cite the
# source in `reference`.
#
# New source x variable pairs are appended automatically when the code
# gains them; run: python tools/build_registry.py
