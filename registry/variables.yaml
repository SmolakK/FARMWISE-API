  farmwise_api.adapters.API_readers.imgw.imgw_api_synop_daily:
    dataset: IMGW-PIB daily synoptic meteorological observations (dane meteorologiczne dobowe
      - synop)
    provider: Instytut Meteorologii i Gospodarki Wodnej — Państwowy Instytut Badawczy (IMGW-PIB)
    reference: https://danepubliczne.imgw.pl/data/dane_pomiarowo_obserwacyjne/dane_meteorologiczne/dobowe/synop/
    spatial_resolution: not applicable - irregular meteorological station network
    spatial_support: point observations at IMGW-PIB synoptic meteorological stations in Poland
    temporal_support: daily observations available in the current IMGW daily synoptic archive
      from 1966 onward; availability of recent observations depends on the publication schedule
      and station
    variables:
      Average daily temperature [°C]:
        native_unit: °C
        notes: daily mean air temperature reported by IMGW-PIB; the adapter currently does
          not use the associated IMGW measurement-status field
        reference: null
        transformation: none - values are passed through without unit conversion
      Daily precipitation total [mm]:
        native_unit: mm
        notes: daily precipitation total reported by IMGW-PIB; the adapter currently does
          not use the associated IMGW measurement-status field
        reference: null
        transformation: none - values are passed through without unit conversion
  farmwise_api.adapters.API_readers.imgw_hydro.imgw_api_hydro_daily:
    dataset: IMGW-PIB daily hydrological observations
    provider: Instytut Meteorologii i Gospodarki Wodnej — Państwowy Instytut Badawczy (IMGW-PIB)
    reference: https://danepubliczne.imgw.pl/data/dane_pomiarowo_obserwacyjne/dane_hydrologiczne/dobowe/
    spatial_resolution: not applicable - irregular hydrological station network
    spatial_support: point observations at IMGW-PIB hydrological gauging stations in Poland
    temporal_support: daily hydrological observations available from 1951 onward; publication
      of completed annual archives occurs with a delay and the latest currently published
      daily archive is 2025
    variables:
      Flow [m³/s]:
        native_unit: m³/s
        notes: daily river discharge; depending on station instrumentation, daily discharge
          may represent a chronological mean of instantaneous values or a value corresponding
          to the 06:00 UTC water-level observation
        reference: null
        transformation: none - values are passed through without unit conversion
      Water level [cm]:
        native_unit: cm
        notes: daily water level at an IMGW-PIB hydrological gauging station
        reference: null
        transformation: none - values are passed through without unit conversion
  farmwise_api.adapters.API_readers.irish_meteo.irish_ms_daily:
    dataset: Met Éireann Daily Rainfall 1 x 1 km Grids
    provider: Met Éireann
    reference: https://clidata.met.ie/cli/grids_daily/
    spatial_resolution: 1 km x 1 km
    spatial_support: regular gridded rainfall estimates covering Ireland, derived by Met Éireann
      from station observations and provided in the TM65 / Irish Grid coordinate system
    temporal_support: daily rainfall totals; current latest release covers 1941-01-01 through
      2025-12-31 and is updated annually
    variables:
      precipitation [mm]:
        native_unit: 0.1 mm (integer-encoded tenths of a millimetre)
        notes: daily rainfall total on the official Met Éireann 1 x 1 km interpolated rainfall
          grid
        reference: null
        transformation: divide source values by 10 to convert encoded tenths of a millimetre
          to mm; grid coordinates are transformed from EPSG:29902 to WGS84 before assignment
          to S2 cells
  farmwise_api.adapters.API_readers.soilgrids.soilgrids_call:
    dataset: SoilGrids 2.0 predicted soil-property maps
    provider: ISRIC — World Soil Information
    reference: https://doi.org/10.5194/soil-7-217-2021
    spatial_resolution: 250 m native SoilGrids resolution
    spatial_support: global gridded model predictions; FARMWISE requests a WCS subset, resamples
      it to dimensions determined by the requested S2 level, and aggregates values to S2 cells
    temporal_support: static modelled soil-property product rather than a time series; SoilGrids
      has no single observation year. FARMWISE currently replicates the same static soil values
      across every day in the requested time interval
    variables:
      bdod:
        native_unit: cg/cm³
        notes: FARMWISE uses the mean SoilGrids prediction for 0-5 cm depth
        physical_meaning: bulk density of the fine earth fraction
        reference: null
        transformation: divide by 100 to convert cg/cm³ to kg/dm³
      cec:
        native_unit: mmol(c)/kg
        notes: FARMWISE uses the mean SoilGrids prediction for 0-5 cm depth
        physical_meaning: cation exchange capacity buffered at pH 7
        reference: null
        transformation: divide by 10 to convert mmol(c)/kg to cmol(c)/kg
      cfvo:
        native_unit: cm³/dm³
        notes: FARMWISE uses the mean SoilGrids prediction for 0-5 cm depth
        physical_meaning: volumetric content of coarse fragments
        reference: null
        transformation: divide by 10 to convert volumetric per-mille units to percent
      clay:
        native_unit: g/kg
        notes: FARMWISE uses the mean SoilGrids prediction for 0-5 cm depth
        physical_meaning: clay content by mass
        reference: null
        transformation: divide by 10 to convert g/kg to percent by mass
      nitrogen:
        native_unit: cg/kg
        notes: FARMWISE uses the mean SoilGrids prediction for 0-5 cm depth
        physical_meaning: total soil nitrogen content
        reference: null
        transformation: divide by 100 to convert cg/kg to g/kg
      ocd:
        native_unit: hg/m³
        notes: FARMWISE uses the mean SoilGrids prediction for 0-5 cm depth
        physical_meaning: soil organic carbon density
        reference: null
        transformation: divide by 10 to convert hg/m³ to kg/m³
      ocs:
        native_unit: t/ha
        notes: FARMWISE uses the mean SoilGrids prediction for the integrated 0-30 cm layer
        physical_meaning: soil organic carbon stock
        reference: null
        transformation: divide by 10 to convert t/ha to kg/m²
      phh2o:
        native_unit: pH x 10
        notes: FARMWISE uses the mean SoilGrids prediction for 0-5 cm depth
        physical_meaning: soil pH measured in water
        reference: null
        transformation: divide by 10 to obtain pH
      sand:
        native_unit: g/kg
        notes: FARMWISE uses the mean SoilGrids prediction for 0-5 cm depth
        physical_meaning: sand content by mass
        reference: null
        transformation: divide by 10 to convert g/kg to percent by mass
      silt:
        native_unit: g/kg
        notes: FARMWISE uses the mean SoilGrids prediction for 0-5 cm depth
        physical_meaning: silt content by mass
        reference: null
        transformation: divide by 10 to convert g/kg to percent by mass
      soc:
        native_unit: dg/kg
        notes: FARMWISE uses the mean SoilGrids prediction for 0-5 cm depth
        physical_meaning: soil organic carbon content
        reference: null
        transformation: divide by 10 to convert dg/kg to g/kg
  farmwise_api.adapters.API_readers.wetterdienst.wetterdienst_dwd:
    dataset: Daily station observations (temperature, pressure, precipitation, sunshine duration,
      etc.) for Germany
    provider: Deutscher Wetterdienst (DWD)
    reference: https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/daily/kl/DESCRIPTION_obsgermany-climate-daily-kl_en.pdf
    spatial_resolution: not applicable - irregular weather-station network
    spatial_support: point observations at DWD and partner weather-station locations in Germany
    temporal_support: daily observations; source records extend back to 1781 depending on
      station, while FARMWISE dispatch is restricted to 1950-01-01 through the current day;
      historical records have completed quality control whereas recent records may not yet
      have completed quality control
    variables:
      precipitation_height:
        native_unit: mm
        notes: daily precipitation height; Wetterdienst parameter precipitation_height, original
          DWD parameter RSK
        reference: null
        transformation: none - values are passed through without unit conversion
      temperature_air_mean_2m:
        native_unit: °C
        notes: daily mean air temperature at 2 m above ground; Wetterdienst parameter temperature_air_mean_2m,
          original DWD parameter TMK
        reference: null
        transformation: none - values are passed through without unit conversion
