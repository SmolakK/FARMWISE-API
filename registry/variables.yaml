  farmwise_api.adapters.API_readers.cds.cds_single_levels:
    dataset: reanalysis-era5-single-levels
    provider: Copernicus Climate Change Service (C3S), implemented by ECMWF
    reference: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels
    spatial_resolution: 0.25° x 0.25°
    spatial_support: global regular latitude-longitude grid; FARMWISE adapter requests a bounding-box
      subset and aggregates grid cells to requested S2 cells
    temporal_support: hourly ERA5 data available from 1940 to present; FARMWISE dispatch currently
      uses data from 1950-01-01 to approximately 5 days before the current date and aggregates
      hourly observations to daily values
    variables:
      2m_temperature:
        native_unit: K
        notes: FARMWISE output is Temperature [°C]
        physical_meaning: air temperature at 2 m above the surface
        reference: null
        transformation: K to °C by subtracting 273.15; hourly instantaneous values are aggregated
          to daily mean
      total_precipitation:
        native_unit: m
        notes: FARMWISE retrieves the following midnight when necessary so that the final
          requested day contains all 24 hourly accumulation intervals
        physical_meaning: total precipitation accumulated over the corresponding ERA5 accumulation
          interval
        reference: null
        transformation: m to mm by multiplying by 1000; hourly accumulations are assigned
          to the preceding hour and summed to daily precipitation
      volumetric_soil_water_layer_1:
        native_unit: m³ m⁻³
        notes: FARMWISE output is Soil moisture [%]
        physical_meaning: volumetric soil water content in ERA5 soil layer 1 (0-7 cm)
        reference: null
        transformation: volumetric fraction to percent by multiplying by 100; hourly instantaneous
          values are aggregated to daily mean
  farmwise_api.adapters.API_readers.corine.corine_read:
    dataset: CORINE Land Cover status layers 1990, 2000, 2006, 2012 and 2018, accessed through
      EEA ArcGIS feature services
    provider: European Union's Copernicus Land Monitoring Service (CLMS)
    reference: https://land.copernicus.eu/en/products/corine-land-cover
    spatial_resolution: vector polygons, 25 ha minimum mapping unit, 100 m minimum mapping
      width
    spatial_support: polygon; reduced to the class covering the largest share of each S2 cell
    temporal_support: survey snapshots for 1990, 2000, 2006, 2012 and 2018; each snapshot
      is carried forward until the next one begins
    variables:
      (land cover):
        native_unit: none - categorical level-3 class code
        notes: 'Values are the provider''s own CLC level-3 codes (44 classes); labels are
          in farmwise_api.adapters.API_readers.corine.corine_mappings.corine_mapping.CLC_CLASSES,
          transcribed from the service legend. The returned row does not record which survey
          it came from: a request after 2018 is served the 2018 classification stamped with
          the requested date.'
        output_unit: none - categorical level-3 class code
        physical_meaning: CORINE Land Cover level-3 class occupying the largest area of the
          S2 cell
        reference: https://image.discomap.eea.europa.eu/arcgis/rest/services/Corine/CLC2018_WM/MapServer/legend
        transformation: none - the Code_YY field is passed through unchanged; selection is
          by largest intersected area within each S2 cell
  farmwise_api.adapters.API_readers.correctiv.correctiv_read:
    dataset: monthly minimum, mean and maximum groundwater levels in metres above sea level
      for roughly 6,700 monitoring stations, 1990-2021, with long-term trend classifications
    provider: CORRECTIV (CORRECTIV.Lokal), compiling observations supplied by the groundwater
      monitoring authorities of 13 German federal states
    reference: https://github.com/correctiv/grundwasser-data
    spatial_resolution: not applicable - irregular monitoring-station network
    spatial_support: point observations at roughly 6,700 groundwater monitoring stations in
      13 German federal states
    temporal_support: monthly statistics 1990-2021; FARMWISE repeats each monthly value on
      every day of that month
    variables:
      max_gwl:
        native_unit: m a.s.l.
        notes: 'Output: ''Maximum groundwater level [m a.s.l.]''. Earlier labels called this
          a ''Depth'', which described an elevation incorrectly. The vertical datum is not
          stated in the published data. Source is disabled from dispatch (protected dataset).'
        physical_meaning: monthly maximum groundwater level (elevation of the water table)
        reference: https://github.com/correctiv/grundwasser-data
        transformation: monthly value repeated on each day of the month
      mean_gwl:
        native_unit: m a.s.l.
        notes: 'Output: ''Mean groundwater level [m a.s.l.]''. Earlier labels called this
          a ''Depth'', which described an elevation incorrectly. The vertical datum is not
          stated in the published data. Source is disabled from dispatch (protected dataset).'
        physical_meaning: monthly mean groundwater level (elevation of the water table)
        reference: https://github.com/correctiv/grundwasser-data
        transformation: monthly value repeated on each day of the month
      min_gwl:
        native_unit: m a.s.l.
        notes: 'Output: ''Minimum groundwater level [m a.s.l.]''. Earlier labels called this
          a ''Depth'', which described an elevation incorrectly. The vertical datum is not
          stated in the published data. Source is disabled from dispatch (protected dataset).'
        physical_meaning: monthly minimum groundwater level (elevation of the water table)
        reference: https://github.com/correctiv/grundwasser-data
        transformation: monthly value repeated on each day of the month
  farmwise_api.adapters.API_readers.eea.eea_read:
    dataset: Environmental Zones 2018 - version 1.0
    provider: European Environment Agency (EEA)
    reference: https://data.europa.eu/data/datasets/6ef007ab-1fcd-4c4f-bc96-14e8afbcb688
    spatial_resolution: '100 m raster pixel size; derived from the Environmental Stratification
      of Europe with an original spatial resolution of 1 km

      '
    spatial_support: 'categorical raster covering Europe in ETRS89 / LAEA Europe (EPSG:3035);
      FARMWISE clips the raster to the requested bounding box, reprojects it to WGS84 and
      aggregates raster values to S2 cells

      '
    temporal_support: 'static Environmental Zones 2018 classification; not a time series.
      FARMWISE currently repeats the 2018 classification for each requested day

      '
    variables:
      value:
        native_unit: none - categorical environmental-zone code
        notes: 'categorical environmental stratification derived from the Environmental Stratification
          of Europe; values must not be interpreted as continuous measurements

          '
        output_unit: none - categorical environmental-zone code
        reference: null
        transformation: 'no unit conversion; raster is reprojected using nearest-neighbour
          resampling and categorical values are aggregated to S2 cells

          '
  farmwise_api.adapters.API_readers.egdi.egdi_read_d10:
    dataset: 'GeoERA HOVER WP7 - Pan-European Vulnerability to Pollution: D-Layer - Depth
      to water table (10km Resolution), layer gewp7_peu1_d'
    provider: Federal Institute for Geosciences and Natural Resources (BGR), distributed through
      EGDI
    reference: https://metadata.europe-geology.eu/record/basic/610bfed1-5b08-4cac-bc7c-66820a010833
    spatial_resolution: 10 km (INSPIRE reference grid)
    spatial_support: raster compiled from national depth-to-water-table datasets, published
      in ETRS89-LAEA (EPSG:3035); FARMWISE reads a local copy named gewp7_peu1_d10km_4326.tif,
      takes pixel centres inside the bounding box and aggregates them to S2 cells
    temporal_support: static layer (created 2021-08-31); not a time series. FARMWISE repeats
      the value for every requested day
    variables:
      (unspecified):
        native_unit: none - DRASTIC D index score 1-10 (dimensionless)
        notes: Output column 'Depth to Watertable DRASTIC'. Published as 4-byte integer scores.
          Higher scores mean a shallower water table. The adapter declares no factor in API_PATH_RANGES
          because dispatch is disabled (not licensed for redistribution).
        output_unit: none - DRASTIC D index score 1-10 (dimensionless)
        physical_meaning: depth to the groundwater table from the surface, reclassified to
          D index scores 1-10 using the class breaks of Aller et al. (1987)
        reference: null
        transformation: no unit conversion; nodata pixels are masked, the ordinal scores of
          pixels in each S2 cell are averaged with the configured within-source method (mean),
          so an output value can fall between two index classes
  farmwise_api.adapters.API_readers.egdi.egdi_read_hc:
    dataset: 'GeoERA HOVER WP7 - Pan-European Vulnerability to Pollution: C-Layer - Hydraulic
      conductivity, layer gewp7_peu7_c'
    provider: Federal Institute for Geosciences and Natural Resources (BGR), distributed through
      EGDI
    reference: https://metadata.europe-geology.eu/record/basic/610d3918-fdb8-4f82-947e-2ee40a010833
    spatial_resolution: raster conversion of IHME1500 (1:1,500,000) Level 2 legend units;
      pixel size not stated in the EGDI metadata
    spatial_support: hydraulic conductivity of IHME1500 Level 2 legend classes averaged from
      literature data, published in ETRS89-LAEA (EPSG:3035); FARMWISE reads a local copy named
      gewp7_peu7_4326.tif, takes pixel centres inside the bounding box and aggregates them
      to S2 cells
    temporal_support: static layer (created 2020-06-09); not a time series. FARMWISE repeats
      the value for every requested day
    variables:
      (unspecified):
        native_unit: none - DRASTIC C index score 1-10 (dimensionless)
        notes: Output column 'Hydraulic Conductivity DRASTIC'. Published as 4-byte floating-point
          scores. The adapter declares no factor in API_PATH_RANGES because dispatch is disabled
          (not licensed for redistribution).
        output_unit: none - DRASTIC C index score 1-10 (dimensionless)
        physical_meaning: hydraulic conductivity of the aquifer class, expressed as a DRASTIC
          C index score following the HOVER classification
        reference: null
        transformation: no unit conversion; nodata pixels are masked, the ordinal scores of
          pixels in each S2 cell are averaged with the configured within-source method (mean),
          so an output value can fall between two index classes
  farmwise_api.adapters.API_readers.epa_ireland.epa_gw:
    dataset: EPA HydroNet groundwater-level daily mean time series
    provider: Environmental Protection Agency Ireland
    reference: https://www.epa.ie/our-services/monitoring--assessment/freshwater--marine/groundwater/
    spatial_resolution: not applicable - irregular groundwater monitoring network
    spatial_support: 'point observations at groundwater monitoring stations from the EPA HydroNet
      network; FARMWISE currently uses a curated local station catalogue and aggregates stations
      falling within the same S2 cell

      '
    temporal_support: 'station-dependent groundwater-level records, with some records extending
      back to the 1970s; groundwater levels are generally monitored at sub-daily frequency,
      while FARMWISE consumes HydroNet daily-mean time series

      '
    variables:
      groundwater level [m OD Malin]:
        native_unit: m above Ordnance Datum Malin (OSGM02)
        notes: 'Output: Groundwater level [m a.s.l.] - shared FARMWISE groundwater-level column.
          EPA HydroNet series ''Groundwater Level'' / ''Day.Mean.Abs'', as stated in each
          station export header. The export also carries a ''Quality Code Name'' column, which
          FARMWISE does not currently read. Datum is not converted to a European reference.'
        physical_meaning: daily mean groundwater level (elevation of the water table)
        reference: null
        transformation: none - the published daily mean is returned unchanged
  farmwise_api.adapters.API_readers.geosphere.geosphere:
    dataset: Station Data-v2 (1 d), resource klima-v2-1d
    provider: GeoSphere Austria
    reference: https://doi.org/10.60669/gs6w-jd70
    spatial_resolution: not applicable - irregular weather-station network
    spatial_support: point observations at GeoSphere Austria weather-station locations
    temporal_support: daily observations; dataset contains station-dependent historical records
      from 1775 onward, while FARMWISE dispatch is restricted to 1950-01-01 through the current
      day
    variables:
      rr:
        native_unit: mm
        notes: 24-hour precipitation sum
        reference: null
        transformation: negative precipitation values are set to 0 mm; otherwise values are
          passed through without unit conversion
      tl_mittel:
        native_unit: °C
        notes: mean air temperature at 2 m above the surface
        reference: null
        transformation: none - values are passed through without unit conversion
