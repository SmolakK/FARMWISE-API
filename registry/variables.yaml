# FARMWISE variable/source registry - AUTHORED metadata.
#
# This file holds only what cannot be derived from the code: native
# units, spatial/temporal support, and literature references. Everything
# else (variable names, output units, aggregation and harmonisation
# rules, coverage) is read live from the adapters by
# tools/build_registry.py and must not be duplicated here. The one
# exception is `output_unit`, seeded only for variables whose adapter
# label carries no unit (categorical codes, index rasters).
#
# `null` means NOT YET SUPPLIED. It is reported as missing, never
# guessed. Fill these in from provider documentation and cite the
# source in `reference`.
#
# New source x variable pairs are appended automatically when the code
# gains them; run: python tools/build_registry.py
sources:
  farmwise_api.adapters.API_readers.EuroCropV2.EuroCropV2_read:
    dataset: EuroCropsV2
    provider: European Commission, Joint Research Centre (JRC), with contributing national
      paying agencies
    reference: https://doi.org/10.2905/b9fb9e67-78a9-4327-9d59-39a928d812d3
    spatial_resolution: parcel-level agricultural field declarations; irregular parcel geometries
    spatial_support: 'agricultural parcels from national Geo-Spatial Application (GSA) datasets;
      FARMWISE uses a preprocessed point representation of parcel records for assignment to
      S2 cells and selects the modal cultivation code within each S2 cell

      '
    temporal_support: 'annual crop declarations with dataset-wide coverage from 2008 through
      2023; availability varies by country and year

      '
    variables:
      c:
        native_unit: none - categorical cultivation code
        notes: 'original annual cultivation code from the corresponding GSA layer. Codes are
          categorical and must not be interpreted as continuous numerical values. FARMWISE
          uses the modal code when multiple records fall within the same S2 cell.

          '
        output_unit: none - categorical cultivation code
        reference: null
        transformation: 'no numerical unit conversion; annual categorical cultivation codes
          are aggregated within S2 cells using mode and the annual value is repeated for requested
          days within that year

          '
