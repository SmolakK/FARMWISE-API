  farmwise_api.adapters.API_readers.hubeau.hubeau_piezo_read_vbrgm:
    dataset: Hub'Eau niveaux_nappes API - groundwater level time series (ADES)
    provider: Office français de la biodiversité (OFB), BRGM, Service Central Vigicrues, and
      the producers identified by individual records
    reference: https://hubeau.eaufrance.fr/
    spatial_resolution: not applicable - irregular piezometer network
    spatial_support: point observations at ADES piezometers (BSS codes) selected from a local
      station catalogue; stations falling in the same S2 cell are aggregated
    temporal_support: one value per measurement date; frequency varies by piezometer, from
      irregular manual readings to daily automatic records; only validated data are requested
    variables:
      niveau_nappe_eau:
        native_unit: m NGF (cote NGF)
        notes: 'Output: Groundwater level [m a.s.l.] - shared FARMWISE groundwater-level column.
          Hub''Eau field description: "Niveau de la nappe d''eau (cote NGF) (mètre)". Datum
          is not converted to a European reference.'
        physical_meaning: groundwater level (elevation of the water table)
        reference: https://hubeau.eaufrance.fr/api/v1/niveaux_nappes/api-docs
        transformation: none - returned in metres; earlier versions multiplied by 100 to centimetres,
          which has been removed
      profondeur_nappe:
        native_unit: m below the local measuring reference
        notes: 'Not a depth below ground: Hub''Eau defines it relative to the measuring reference,
          which is often not the ground surface (negative values occur when water stands above
          it). It is therefore neither comparable with depth-below-ground series nor convertible
          to an elevation without the reference height, and is kept out of the shared level
          column.'
        physical_meaning: depth of the water level below the measuring reference
        reference: https://hubeau.eaufrance.fr/api/v1/niveaux_nappes/api-docs
        transformation: none - not requested by the adapter
