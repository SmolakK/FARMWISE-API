[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farmwise-api"
version = "0.1.0"
description = "European agricultural and environmental data aggregation API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "aiofiles",
    "aiohttp",
    "beautifulsoup4",
    "cdsapi",
    "duckdb",
    "folium",
    "geopy",
    "geopandas",
    "httpx",
    "hubeaupyutils==0.1.0",
    "numpy",
    "openpyxl",
    "pandas",
    "pillow",
    "pyproj",
    "rasterio",
    "requests",
    "s2sphere",
    "scipy",
    "shapely",
    "soilgrids",
    "tenacity",
    "tqdm",
    "wetterdienst>=0.109",
    "xarray",
]

[project.optional-dependencies]
server = [
    "apscheduler",
    "bcrypt<4.1",
    "email-validator",
    "fastapi",
    "passlib[bcrypt]",
    "pydantic",
    "python-dotenv",
    "python-jose[cryptography]",
    "python-multipart",
    "slowapi",
    "sqlalchemy",
    "uvicorn[standard]",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]
evaluation = [
    "matplotlib",
]

[project.scripts]
farmwise-api = "main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "core*", "server*", "evaluation*"]
exclude = ["tests*", "internal-lib*", "adapters.API_readers.egdi*"]

[tool.setuptools]
py-modules = ["main", "main_call", "quality_assess"]
include-package-data = false

[tool.setuptools.package-data]
"adapters.API_readers.epa_ireland" = ["constants/EPA_coordinates.csv"]
"adapters.API_readers.gios" = ["constants/gios_coordinates.csv"]
"adapters.API_readers.hubeau" = ["constants/*.csv"]
"adapters.API_readers.IFSGRID.utils" = ["definitions.json"]
"adapters.API_readers.irish_meteo" = ["EPA_ireland_stations.csv"]
"core.utils" = ["country_codes"]
"server" = ["static/*"]

[tool.setuptools.exclude-package-data]
"*" = [
    "**/data/*",
    "**/data/**/*",
    "**/eea_data/*",
    "**/eea_data/**/*",
    "**/temp_storage/*",
    "**/temp_storage/**/*",
    "*.db",
    "*.nc",
    "*.parquet",
    "*.sqlite",
    "*.sqlite3",
    "*.tif",
    "*.tiff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
