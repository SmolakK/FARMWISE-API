[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farmwise-api"
version = "0.1.0"
description = "European agricultural and environmental data aggregation API"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Kamil Smolak, Dominik Teodorczyk, Jakub Misiewicz, Marc Laurencelle, Wiesław Fiałkiewicz, Arkadiusz Głogowski", email = "kamil.smolak@upwr.edu.pl"},
]
maintainers = [
    { name = "Kamil Smolak", email = "kamil.smolak@upwr.edu.pl" },
]
keywords = ["agriculture", "environmental-data", "geospatial", "S2", "FastAPI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
license-files = [
    "LICENSE",
    "DATA_LICENSES.md",
    "internal-lib/hubeaupyutils/hubeaupyutils-main/LICENSE",
]
requires-python = ">=3.10"
dependencies = [
    "aiofiles",
    "aiohttp",
    "beautifulsoup4",
    "cdsapi",
    "duckdb",
    "folium",
    "geopy",
    "geopandas",
    "httpx",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "pillow",
    "pyproj",
    "rasterio",
    "requests",
    "s2sphere",
    "scipy",
    "shapely",
    "soilgrids",
    "tenacity",
    "tqdm",
    "wetterdienst>=0.109",
    "xarray",
]

[project.optional-dependencies]
server = [
    "apscheduler",
    "bcrypt<4.1",
    "email-validator",
    "fastapi",
    "passlib[bcrypt]",
    "pydantic",
    "python-dotenv",
    "PyJWT[crypto]>=2.8,<3",
    "python-multipart",
    "slowapi",
    "sqlalchemy",
    "uvicorn[standard]",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "setuptools>=77",
    "tomli>=2; python_version < '3.11'",
    "wheel",
]
evaluation = [
    "matplotlib",
]
release = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/SmolakK/FARMWISE-API"
Repository = "https://github.com/SmolakK/FARMWISE-API"
Documentation = "https://github.com/SmolakK/FARMWISE-API#readme"
Issues = "https://github.com/SmolakK/FARMWISE-API/issues"

[project.scripts]
farmwise-api = "farmwise_api.cli:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["farmwise_api*"]
exclude = ["farmwise_api.adapters.API_readers.egdi*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"farmwise_api.adapters.API_readers.epa_ireland" = ["constants/EPA_coordinates.csv"]
"farmwise_api.adapters.API_readers.gios" = ["constants/gios_coordinates.csv"]
"farmwise_api.adapters.API_readers.hubeau" = ["constants/*.csv"]
"farmwise_api.adapters.API_readers.IFSGRID.utils" = ["definitions.json"]
"farmwise_api.adapters.API_readers.irish_meteo" = ["EPA_ireland_stations.csv"]
"farmwise_api.adapters.API_readers.quadica" = ["DATA_SETUP.md", "mappings/quadica_table.html"]
"farmwise_api.core.utils" = ["country_codes"]
"farmwise_api.server" = ["static/*"]

[tool.setuptools.exclude-package-data]
"*" = [
    "**/data/*",
    "**/data/**/*",
    "**/eea_data/*",
    "**/eea_data/**/*",
    "**/temp_storage/*",
    "**/temp_storage/**/*",
    "*.db",
    "*.nc",
    "*.parquet",
    "*.sqlite",
    "*.sqlite3",
    "*.tif",
    "*.tiff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
