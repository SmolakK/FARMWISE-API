[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farmwise-api"
version = "0.1.0"
description = "European agricultural and environmental data aggregation API"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Kamil Smolak, Dominik Teodorczyk, Jakub Misiewicz, Marc Laurencelle, Wiesław Fiałkiewicz, Arkadiusz Głogowski", email = "kamil.smolak@upwr.edu.pl"},
]
maintainers = [
    { name = "Kamil Smolak", email = "kamil.smolak@upwr.edu.pl" },
]
keywords = ["agriculture", "environmental-data", "geospatial", "S2", "FastAPI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
license-files = [
    "LICENSE",
    "DATA_LICENSES.md",
     "farmwise_api/_vendor/hubeaupyutils/LICENSE",
]
requires-python = ">=3.11"
# Version bounds: the floor of each range is the lowest version the test
# suite has been verified against; the ceiling is the next major release
# (next minor for 0.x projects). The floors sit below what the CI matrix
# resolves to (3.11 and 3.12 both pull pandas 3 / NumPy 2.4+), so the
# pandas 2 end of each range is verified by hand, not by CI.
# Exact, reproducible versions live in requirements-lock.txt - see the
# Reproducibility section of README.md.
dependencies = [
    "aiofiles>=25.1,<26",
    "aiohttp>=3.14,<4",
    "beautifulsoup4>=4.15,<5",
    "cdsapi>=0.7.7,<1",
    "duckdb>=1.2.2,<2",
    "folium>=0.20,<1",
    "geopy>=2.5,<3",
    "geopandas>=1.1,<2",
    "httpx>=0.28,<1",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.3,<4",
    "pillow>=12.2,<13",
    "pyproj>=3.7,<4",
    "rasterio>=1.4,<2",
    "requests>=2.34,<3",
    "s2sphere>=0.2.5,<1",
    "scipy>=1.15,<2",
    "shapely>=2.1,<3",
    "soilgrids>=0.1.5,<1",
    "tenacity>=9.1,<10",
    "tqdm>=4.70,<5",
    "wetterdienst>=0.117,<0.137",
    "xarray>=2025.6",
]

[project.optional-dependencies]
server = [
    "apscheduler>=3.11,<4",
    "bcrypt>=4.0,<4.1",
    "email-validator>=2.3,<3",
    "fastapi>=0.141,<1",
    "passlib[bcrypt]>=1.7.4,<2",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "PyJWT[crypto]>=2.13,<3",
    "python-multipart>=0.0.32,<1",
    "slowapi>=0.1.10,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.52,<1",
]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "setuptools>=77,<85",
    "wheel>=0.48,<1",
]
evaluation = [
    # matplotlib is already a core dependency; this extra exists so the
    # evaluation workflow can be installed by name. Jupyter itself is not
    # declared here: install it separately to run the analysis notebook.
    "matplotlib>=3.10,<4",
]
release = [
    "build>=1.2,<2",
    "twine>=6,<8",
]

[project.urls]
Homepage = "https://github.com/SmolakK/FARMWISE-API"
Repository = "https://github.com/SmolakK/FARMWISE-API"
Documentation = "https://github.com/SmolakK/FARMWISE-API#readme"
Issues = "https://github.com/SmolakK/FARMWISE-API/issues"

[project.scripts]
farmwise-api = "farmwise_api.cli:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["farmwise_api*"]
exclude = ["farmwise_api.adapters.API_readers.egdi*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"farmwise_api.adapters.API_readers.epa_ireland" = ["constants/EPA_coordinates.csv"]
"farmwise_api.adapters.API_readers.gios" = ["constants/gios_coordinates.csv"]
"farmwise_api.adapters.API_readers.hubeau" = ["constants/*.csv"]
"farmwise_api._vendor.hubeaupyutils" = ["LICENSE"]
"farmwise_api.adapters.API_readers.IFSGRID.utils" = ["definitions.json"]
"farmwise_api.adapters.API_readers.irish_meteo" = ["EPA_ireland_stations.csv"]
"farmwise_api.adapters.API_readers.quadica" = ["DATA_SETUP.md", "mappings/quadica_table.html"]
"farmwise_api.core.utils" = ["country_codes"]
"farmwise_api.server" = ["static/*"]

[tool.setuptools.exclude-package-data]
"*" = [
    "**/data/*",
    "**/data/**/*",
    "**/eea_data/*",
    "**/eea_data/**/*",
    "**/temp_storage/*",
    "**/temp_storage/**/*",
    "*.db",
    "*.nc",
    "*.parquet",
    "*.sqlite",
    "*.sqlite3",
    "*.tif",
    "*.tiff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["farmwise_api"]
branch = true
omit = [
    # Third-party code vendored verbatim under its own licence; covering it
    # would measure upstream's tests, not this project's.
    "farmwise_api/_vendor/*",
    # One-off scripts that rebuild bundled station files from upstream
    # portals. They are run by hand, need network access, and are not part
    # of the dispatch path.
    "farmwise_api/adapters/API_readers/*/*_stations.py",
    "farmwise_api/adapters/API_readers/*/*_stations_api.py",
]

[tool.coverage.report]
# The floor is set just below the measured figure so it ratchets: a change
# that drops coverage fails CI, while ordinary work has room to move.
fail_under = 80
precision = 1
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
# python_version is deliberately not pinned: mypy then targets whichever
# interpreter it runs under, which is the one whose installed stubs it reads.
# Pinning it to the version floor makes mypy parse the current NumPy stubs (which
# use 3.12 syntax) under older rules and fail before checking any project code.
# CI runs this check across the same matrix as the tests.
#
# Checked packages are listed in the CI invocation: core and server only.
# The adapter layer is not type-checked yet - see README, Development.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
pretty = true
